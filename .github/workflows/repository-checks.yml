name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  domain-and-docs:
    name: Domain, storage, and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pinned development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check documentation, TypeScript, and domain behavior
        run: npm run check
      - name: Exercise the synthetic domain handoff
        run: npm run demo:domain
      - name: Exercise the SQLite restart demonstration
        run: npm run demo:storage
